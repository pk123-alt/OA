<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OA Knee Severity Predictor</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="container">
      <header class="header">
        <div>
          <p class="eyebrow">Medical Imaging</p>
          <h1>OA Knee Severity Predictor</h1>
        </div>
      </header>

      <main class="panel">
        <section class="upload-section">
          <form id="uploadForm" class="upload-form">
            <label for="imageUpload" class="upload-box">
              <input id="imageUpload" type="file" accept="image/*" />
              <span class="upload-text">Choose knee X-ray image</span>
            </label>

            <button type="submit" id="predictBtn">Predict Severity</button>
          </form>

          <div id="status" class="status hidden"></div>
        </section>

        <section class="result-section">
          <div class="image-preview-box">
            <img id="previewImage" alt="Selected X-ray" hidden />
            <div id="previewPlaceholder" class="placeholder">No image selected</div>
          </div>

          <div class="result-card">
            <h2>Prediction</h2>
            <div class="result-main">
              <span id="severityLabel">--</span>
            </div>

            <div class="probability-list" id="probabilityList">
              <div class="probability-row empty">Upload an image to see results</div>
            </div>
          </div>
        </section>
      </main>
    </div>

    <script src="script.js"></script>
  </body>
</html>
